name: Release

# A Proscala release is a tag <x.y.z> on `main`. Pushing the tag is the whole
# procedure (bin/proscala-release does that after the same checks, for a fast
# answer). The targets — every scala/scala3 final release 3.<y>.<z> from 3.9 on,
# and a snapshot of each upstream branch developing an unreleased version — are
# resolved here, each as
#   <spec> <upstream commit> <version>
# with <version> = <scala version>-pro-<x.y.z>. This workflow:
#
#   plan     checks that the tag is on main and runs `bin/proscala-release --verify`:
#            the version is greater than every earlier release, bin/proscala-check
#            passes, every target gets every patch it should; and resolves the targets
#            (run by hand, it only works them out, for a dry run)
#   build    for each target, in parallel: builds the tree, the distribution and
#            the Maven-layout repository, and tests the patches against it
#            (bin/proscala-test) — nothing leaves the runner yet
#   publish  only once every target has built: creates the GitHub release, with
#            every target's tarball, jars and repository, and targets.txt naming
#            the upstream commit each was built from
#   untag    if anything failed before the release was created: deletes the tag,
#            so that the same version can be pushed again once main is fixed. A
#            version means the bytes of a *published* release; an unpublished tag
#            means nothing, and is the only thing ever deleted from origin.
#
# Releases go to GitHub Releases only. A release publishes for all its targets
# or for none. Run by hand (workflow_dispatch) it is a dry run: it plans and
# builds, and publishes nothing.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (a dry run: nothing is released or published)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dry: ${{ steps.tag.outputs.dry }}
      release: ${{ steps.tag.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        # Full history: which patches apply is decided by ancestry between
        # upstream commits, which a shallow checkout cannot see.
        with:
          fetch-depth: 0

      # Its own step, so that `release` is known even when verification fails:
      # `untag` must delete the tag of a failed Proscala release and nothing else.
      - name: Is this a Proscala release?
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${{ inputs.version }}"
            dry=true
          else
            version="$GITHUB_REF_NAME"
            dry=false
            git fetch --force origin "refs/tags/$version:refs/tags/$version"
            # A Proscala release is tagged on main's history; any other tag is not
            # one, and there is nothing to do.
            if ! git merge-base --is-ancestor "$version^{commit}" origin/main; then
              echo "release: tag $version is not on main, so it is not a Proscala release" >&2
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Tag \`$version\` is not on \`main\`: not a Proscala release, nothing built." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry=$dry"         >> "$GITHUB_OUTPUT"
          echo "release=true"     >> "$GITHUB_OUTPUT"

      - name: Verify, and work out the targets
        id: plan
        if: steps.tag.outputs.release == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          if [ "${{ steps.tag.outputs.dry }}" = true ]; then
            targets="$(bin/proscala-release "$version" --targets)"
          else
            # The checks bin/proscala-release makes before tagging, on the tagged commit.
            targets="$(bin/proscala-release "$version" --verify)"
          fi
          matrix="$(printf '%s\n' "$targets" | awk 'BEGIN { printf "{\"include\":[" }
            NF == 3 { printf "%s{\"spec\":\"%s\",\"commit\":\"%s\",\"version\":\"%s\"}", (n++ ? "," : ""), $1, $2, $3 }
            END { printf "]}" }')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          { echo "targets<<EOF"; printf '%s\n' "$targets"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "### Proscala $version"; echo; echo '| target | upstream commit | version |'; echo '| --- | --- | --- |'
            printf '%s\n' "$targets" | awk '{ printf "| %s | %s | %s |\n", $1, substr($2, 1, 10), $3 }'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every target runs to the end, so one failure shows them all; publishing
      # still waits for every build to succeed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The commit, not the spec: `main` may have moved on since the tag was cut.
      - name: Build the source tree
        run: bin/proscala-tree "${{ matrix.commit }}" worktrees/dist

      - name: Build the distribution
        working-directory: worktrees/dist
        run: |
          set -euo pipefail
          v="${{ matrix.version }}"
          make BRANCH=dist VERSION="$v" clean
          make BRANCH=dist VERSION="$v" tarball release-jars maven-repo
          mkdir -p ../../out
          cp "release/dist/proscala-$v.tar.gz" "release/dist/proscala-$v-maven.zip" release/dist/jars/*.jar ../../out/

      # Every patch's executable reproduction and its own tests, against the
      # compiler just built: a target whose patches misbehave is not released.
      - name: Test the patches
        run: bin/proscala-test worktrees/dist

      - uses: actions/upload-artifact@v4
        with:
          name: proscala-${{ matrix.version }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.dry == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # Every target's tarball, jars (under their Maven names) and Maven-layout
      # repository, plus targets.txt, in one command, so the release can never
      # exist with only some of them attached.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          shopt -s failglob
          tag="$GITHUB_REF_NAME"
          # What this release was built for: "<spec> <upstream commit> <version>" per line.
          printf '%s\n' "$TARGETS" > built/targets.txt
          {
            echo "Proscala ${{ needs.plan.outputs.version }}, built from ${GITHUB_SHA}, for:"
            echo
            echo '| Scala | sbt `scalaVersion` (with `scalaOrganization := "dev.propensive"`) |'
            echo '| --- | --- |'
            awk 'NF == 3 { printf "| %s (`%s`) | `%s` |\n", $1, substr($2, 1, 10), $3 }' built/targets.txt
            echo
            echo 'Each `proscala-<version>-maven.zip` is a Maven repository of that build. Unzip them into one'
            echo 'directory and use it in sbt with:'
            echo
            echo '```scala'
            echo 'val proscala = file("/path/to/proscala-repo")   // the unzipped proscala-<version>-maven.zip'
            echo 'resolvers         += "proscala" at proscala.toURI.toString'
            echo 'scalaOrganization := "dev.propensive"'
            echo 'scalaVersion      := "<version from the table>"'
            echo '// sbt also wants these two, which Proscala does not provide as it expects:'
            echo 'excludeDependencies += "dev.propensive" % "scaladoc_3"   // no scaladoc is built'
            echo 'scalaCompilerBridgeBinaryJar := Some(proscala / s"dev/propensive/scala3-sbt-bridge/${scalaVersion.value}/scala3-sbt-bridge-${scalaVersion.value}.jar")'
            echo '```'
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Proscala ${{ needs.plan.outputs.version }}" --notes-file notes.md \
            built/*

      # The descriptors crux (propensive/crux) reads when it uses this release as an Ivy-pattern
      # repository — one per loose jar, derived from the POMs — go to the `ivy` branch, once the
      # release they describe exists.
      - name: Publish the descriptors to the ivy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./etc/ivy-publish.sh built

  # A release that was not published leaves no tag behind. `always()` so that
  # this runs after a failure; the guards so that it runs only for a real
  # Proscala release tag (not a dry run, not a tag off main) that did not get
  # as far as a GitHub release.
  untag:
    needs: [plan, build, publish]
    if: always() && github.event_name == 'push' && needs.plan.outputs.release == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete the tag of the unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # If a GitHub release exists, something was published after all: the
          # tag then means those bytes, and a person must decide what to do.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "untag: a GitHub release $tag exists; leaving the tag alone" >&2
            echo "Release \`$tag\` exists although the run failed: tag kept, needs a look." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin ":refs/tags/$tag"
          echo "Release \`$tag\` was not published: its tag has been deleted. Fix \`main\` and push the tag again." >> "$GITHUB_STEP_SUMMARY"
