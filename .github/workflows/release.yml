name: Release

# A Proscala release is a tag v<x.y.z> on `main`, pushed by bin/proscala-release.
# Its annotation lists the targets — every scala/scala3 final release 3.<y>.<z>
# from 3.9 on, and a snapshot of scala/scala3 main — each as
#   target <spec> <upstream commit> <version>
# with <version> = <scala version>-proscala-<x.y.z>. This workflow:
#
#   plan     reads the targets (or, run by hand, works them out for a dry run)
#   build    for each target, in parallel: builds the tree and the distribution,
#            and the signed Maven Central bundle — nothing leaves the runner yet
#   publish  only once every target has built: creates the GitHub release with
#            every tarball and jar, then uploads every bundle to Maven Central
#
# So a release either publishes for all its targets or for none. Run by hand
# (workflow_dispatch) it is a dry run: it plans and builds, and publishes nothing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (a dry run: nothing is released or published)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry: ${{ steps.plan.outputs.dry }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        # Full history: which patches apply is decided by ancestry between
        # upstream commits, which a shallow checkout cannot see.
        with:
          fetch-depth: 0
      - name: Work out the targets
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${{ inputs.version }}"
            targets="$(bin/proscala-release "$version" --targets)"
            dry=true
          else
            version="${GITHUB_REF_NAME#v}"
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            targets="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | awk '$1 == "target" { print $2, $3, $4 }')"
            [ -n "$targets" ] || { echo "release: tag $GITHUB_REF_NAME lists no targets (was it made by bin/proscala-release?)" >&2; exit 1; }
            dry=false
          fi
          matrix="$(printf '%s\n' "$targets" | awk 'BEGIN { printf "{\"include\":[" }
            NF == 3 { printf "%s{\"spec\":\"%s\",\"commit\":\"%s\",\"version\":\"%s\"}", (n++ ? "," : ""), $1, $2, $3 }
            END { printf "]}" }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry=$dry"         >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"   >> "$GITHUB_OUTPUT"
          { echo "### Proscala $version"; echo; echo '| target | upstream commit | version |'; echo '| --- | --- | --- |'
            printf '%s\n' "$targets" | awk '{ printf "| %s | %s | %s |\n", $1, substr($2, 1, 10), $3 }'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Checked before anything slow happens: a release that builds for an hour
      # and then cannot sign should stop in seconds instead.
      - name: Import the signing key
        if: needs.plan.outputs.dry == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${GPG_PRIVATE_KEY:-}" ] && [ -n "${GPG_PASSPHRASE:-}" ] \
            || { echo "release: GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets are missing" >&2; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf 'release' | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --output /dev/null
          echo "Signing key imported and verified."

      # The commit, not the spec: `main` has moved on since the tag was cut.
      - name: Build the source tree
        run: bin/proscala-tree "${{ matrix.commit }}" worktrees/dist

      - name: Build the distribution
        working-directory: worktrees/dist
        env:
          PROSCALA_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          v="${{ matrix.version }}"
          make BRANCH=dist VERSION="$v" clean
          make BRANCH=dist VERSION="$v" tarball release-jars
          if [ "${{ needs.plan.outputs.dry }}" = false ]; then
            make BRANCH=dist VERSION="$v" publish-bundle
          fi
          mkdir -p ../../out/assets ../../out/bundles
          cp "release/dist/proscala-$v.tar.gz" release/dist/jars/*.jar ../../out/assets/
          if [ -f "release/dist/proscala-$v-bundle.zip" ]; then cp "release/dist/proscala-$v-bundle.zip" ../../out/bundles/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: proscala-${{ matrix.version }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.dry == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Central credentials
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          [ -n "${SONATYPE_USERNAME:-}" ] && [ -n "${SONATYPE_PASSWORD:-}" ] \
            || { echo "release: SONATYPE_USERNAME / SONATYPE_PASSWORD secrets are missing" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # The tarballs and every published jar, under their Maven names, in one
      # command, so the release can never exist with only some of them attached.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s failglob
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          {
            echo "Proscala ${{ needs.plan.outputs.version }}, built from ${GITHUB_SHA}, for:"
            echo
            echo '| Scala | sbt `scalaVersion` (with `scalaOrganization := "dev.propensive"`) |'
            echo '| --- | --- |'
            git tag -l --format='%(contents)' "$tag" | awk '$1 == "target" { printf "| %s (`%s`) | `%s` |\n", $2, substr($3, 1, 10), $4 }'
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Proscala ${{ needs.plan.outputs.version }}" --notes-file notes.md \
            built/assets/*

      # Last, because Maven Central is append-only. Each target is its own
      # deployment; a failure here can be retried for the same bundles by
      # re-running this job.
      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s failglob
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')
          for zip in built/bundles/*.zip; do
            v="$(basename "$zip" -bundle.zip)"; v="${v#proscala-}"
            echo ">> uploading dev.propensive-proscala:$v"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $token" -F "bundle=@$zip" \
              "https://central.sonatype.com/api/v1/publisher/upload?name=dev.propensive-proscala:$v&publishingType=AUTOMATIC"
            echo
          done
