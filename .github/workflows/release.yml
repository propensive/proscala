name: Release

# A Proscala release is a tag <x.y.z> on `main`, pushed by bin/proscala-release.
# Its annotation lists the targets — every scala/scala3 final release 3.<y>.<z>
# from 3.9 on, and a snapshot of each upstream branch developing an unreleased
# version — each as
#   target <spec> <upstream commit> <version>
# with <version> = <scala version>-pro-<x.y.z>. This workflow:
#
#   plan     reads the targets (or, run by hand, works them out for a dry run)
#   build    for each target, in parallel: builds the tree, the distribution and
#            the Maven-layout repository, and tests the patches against it
#            (bin/proscala-test) — nothing leaves the runner yet
#   publish  only once every target has built: creates the GitHub release, with
#            every target's tarball, jars and repository
#
# Releases go to GitHub Releases only. A release publishes for all its targets
# or for none. Run by hand
# (workflow_dispatch) it is a dry run: it plans and builds, and publishes nothing.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (a dry run: nothing is released or published)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry: ${{ steps.plan.outputs.dry }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        # Full history: which patches apply is decided by ancestry between
        # upstream commits, which a shallow checkout cannot see.
        with:
          fetch-depth: 0
      - name: Work out the targets
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${{ inputs.version }}"
            targets="$(bin/proscala-release "$version" --targets)"
            dry=true
          else
            version="$GITHUB_REF_NAME"
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            # This repository also holds scala/scala3's own tags (3.10.0, 0.26.0, ...), which
            # look like versions too. A Proscala release is tagged on main's history; any
            # other tag is not one, and there is nothing to do.
            if ! git merge-base --is-ancestor "$GITHUB_REF_NAME^{commit}" origin/main; then
              echo "release: tag $GITHUB_REF_NAME is not on main, so it is not a Proscala release" >&2
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "Tag \`$GITHUB_REF_NAME\` is not on \`main\`: not a Proscala release, nothing built." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            targets="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | awk '$1 == "target" { print $2, $3, $4 }')"
            [ -n "$targets" ] || { echo "release: tag $GITHUB_REF_NAME lists no targets (was it made by bin/proscala-release?)" >&2; exit 1; }
            dry=false
          fi
          matrix="$(printf '%s\n' "$targets" | awk 'BEGIN { printf "{\"include\":[" }
            NF == 3 { printf "%s{\"spec\":\"%s\",\"commit\":\"%s\",\"version\":\"%s\"}", (n++ ? "," : ""), $1, $2, $3 }
            END { printf "]}" }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry=$dry"         >> "$GITHUB_OUTPUT"
          echo "release=true"     >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"   >> "$GITHUB_OUTPUT"
          { echo "### Proscala $version"; echo; echo '| target | upstream commit | version |'; echo '| --- | --- | --- |'
            printf '%s\n' "$targets" | awk '{ printf "| %s | %s | %s |\n", $1, substr($2, 1, 10), $3 }'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every target runs to the end, so one failure shows them all; publishing
      # still waits for every build to succeed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The commit, not the spec: `main` has moved on since the tag was cut.
      - name: Build the source tree
        run: bin/proscala-tree "${{ matrix.commit }}" worktrees/dist

      - name: Build the distribution
        working-directory: worktrees/dist
        run: |
          set -euo pipefail
          v="${{ matrix.version }}"
          make BRANCH=dist VERSION="$v" clean
          make BRANCH=dist VERSION="$v" tarball release-jars maven-repo
          mkdir -p ../../out
          cp "release/dist/proscala-$v.tar.gz" "release/dist/proscala-$v-maven.zip" release/dist/jars/*.jar ../../out/

      # Every patch's executable reproduction and its own tests, against the
      # compiler just built: a target whose patches misbehave is not released.
      - name: Test the patches
        run: bin/proscala-test worktrees/dist

      - uses: actions/upload-artifact@v4
        with:
          name: proscala-${{ matrix.version }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.dry == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      # Every target's tarball, jars (under their Maven names) and Maven-layout
      # repository, in one command, so the release can never exist with only
      # some of them attached.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s failglob
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          {
            echo "Proscala ${{ needs.plan.outputs.version }}, built from ${GITHUB_SHA}, for:"
            echo
            echo '| Scala | sbt `scalaVersion` (with `scalaOrganization := "dev.propensive"`) |'
            echo '| --- | --- |'
            git tag -l --format='%(contents)' "$tag" | awk '$1 == "target" { printf "| %s (`%s`) | `%s` |\n", $2, substr($3, 1, 10), $4 }'
            echo
            echo 'Each `proscala-<version>-maven.zip` is a Maven repository of that build. Unzip them into one'
            echo 'directory and use it in sbt with:'
            echo
            echo '```scala'
            echo 'val proscala = file("/path/to/proscala-repo")   // the unzipped proscala-<version>-maven.zip'
            echo 'resolvers         += "proscala" at proscala.toURI.toString'
            echo 'scalaOrganization := "dev.propensive"'
            echo 'scalaVersion      := "<version from the table>"'
            echo '// sbt also wants these two, which Proscala does not provide as it expects:'
            echo 'excludeDependencies += "dev.propensive" % "scaladoc_3"   // no scaladoc is built'
            echo 'scalaCompilerBridgeBinaryJar := Some(proscala / s"dev/propensive/scala3-sbt-bridge/${scalaVersion.value}/scala3-sbt-bridge-${scalaVersion.value}.jar")'
            echo '```'
          } > notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Proscala ${{ needs.plan.outputs.version }}" --notes-file notes.md \
            built/*
