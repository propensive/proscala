name: Check

# Check `main` against the facts it describes: that the store of patches is
# well-formed and agrees with each patch's bounds at each of its commits, that each
# stream (UPSTREAM_SHA in mk/<stream>.mk) gets every patch it should, and that the
# documentation agrees with its sources of truth. bin/proscala-check fetches the
# scala/scala3 history it needs on its own, shallowly, so a plain checkout of main
# is enough.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        # Full history: which patches apply is decided by ancestry between
        # upstream commits, which a shallow checkout cannot see.
        with:
          fetch-depth: 0
      # The patches are in an Orthant store (.orthant/), which the tools read with `orthant`.
      - name: Install Orthant
        run: |
          curl -fsSL "https://github.com/propensive/orthant/releases/download/$(cat etc/orthant-version)/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the patches and the documentation
        run: bin/proscala-check -v
